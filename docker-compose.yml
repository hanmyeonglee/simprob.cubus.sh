services:
  simprobs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${SIMPROBS_HOST:-simprobs.cubus.sh}
      VIRTUAL_PORT: "80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - web

networks:
  web:
    external: true
    name: cubus_web
