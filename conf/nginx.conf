server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /answers.html {
        try_files $uri =404;
    }

    location = /problems.pdf {
        add_header Content-Disposition 'attachment; filename="problems.pdf"';
        try_files $uri =404;
    }

    location = /answers.pdf {
        add_header Content-Disposition 'attachment; filename="answers.pdf"';
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
